services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      DATABASE_URL: mysql://app:${MYSQL_PASSWORD:-app}@database:3306/app?serverVersion=8.4&charset=utf8mb4
      MAILER_DSN: smtp://mailer:1025
    volumes:
      - ./app:/var/www/app
    depends_on:
      database:
        condition: service_healthy
      mailer:
        condition: service_started

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "app", "-p${MYSQL_PASSWORD:-app}", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mailer:
    image: axllent/mailpit:v1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  # Optional database UI: docker compose --profile tools up -d
  adminer:
    image: adminer:5
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      - database

volumes:
  database_data:
