# Based on https://symfony.com/doc/current/setup/web_server_configuration.html (Nginx)
server {
    listen 80;
    server_name _;
    root /var/www/app/public;

    location / {
        # try to serve file directly, fallback to index.php
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # PHP-FPM runs in another container with the code mounted at the same path,
        # so $document_root is used instead of $realpath_root (see the Symfony docs caveat)
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Prevents URIs that include the front controller (/index.php/some-path → 404)
        internal;
    }

    # return 404 for all other php files not matching the front controller
    location ~ \.php$ {
        return 404;
    }
}
