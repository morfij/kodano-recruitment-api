api_platform:
    title: Kodano Product API
    version: 1.0.0
    formats:
        json: ['application/json']
    error_formats:
        jsonproblem: ['application/problem+json']
    docs_formats:
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    swagger:
        http_auth:
            bearer:
                scheme: bearer
    patch_formats:
        json: ['application/merge-patch+json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
