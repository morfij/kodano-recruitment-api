api_platform:
    title: Kodano Product API
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    swagger:
        http_auth:
            bearer:
                scheme: bearer
    patch_formats:
        json: ['application/merge-patch+json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
