framework:
    rate_limiter:
        # Writes per client IP; see App\EventSubscriber\ApiWriteRateLimitSubscriber.
        # The state lives in cache.rate_limiter (filesystem) and each update runs under
        # the lock from LOCK_DSN. With more than one server both need a shared store,
        # e.g. Redis for cache_pool and LOCK_DSN.
        api_write:
            policy: sliding_window
            limit: '%env(int:API_WRITE_LIMIT)%'
            interval: '1 minute'

when@test:
    framework:
        cache:
            pools:
                # The filesystem pool would carry counts over from earlier tests.
                rate_limiter.test:
                    adapter: cache.adapter.array
        rate_limiter:
            api_write:
                cache_pool: rate_limiter.test
