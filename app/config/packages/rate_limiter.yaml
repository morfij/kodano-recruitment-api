framework:
    rate_limiter:
        # Writes per client IP; see App\EventSubscriber\ApiWriteRateLimitSubscriber.
        # The state lives in cache.rate_limiter (filesystem); point cache_pool to a
        # shared store such as Redis when the API runs on more than one server.
        api_write:
            policy: sliding_window
            limit: '%env(int:API_WRITE_LIMIT)%'
            interval: '1 minute'

when@test:
    framework:
        cache:
            pools:
                # The filesystem pool would carry counts over from earlier tests.
                rate_limiter.test:
                    adapter: cache.adapter.array
        rate_limiter:
            api_write:
                cache_pool: rate_limiter.test
